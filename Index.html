<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Online Quiz</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f0f4f8;
}
.quiz-box{
    width:90%;
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h1{
    text-align:center;
    color:#0066cc;
}
h3{
    color:#333;
}
label{
    display:block;
    margin:8px 0;
    font-size:17px;
}
button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}
button:hover{
    background:#004c99;
}
#result{
    text-align:center;
    color:green;
    font-size:22px;
    margin-top:20px;
}
</style>

</head>
<body>

<div class="quiz-box">

<h1>Python Online Quiz</h1>

<form>

<h3>1. Who developed Python?</h3>
<label><input type="radio" name="q1" value="a"> A. James Gosling</label>
<label><input type="radio" name="q1" value="b"> B. Guido van Rossum</label>
<label><input type="radio" name="q1" value="c"> C. Dennis Ritchie</label>
<label><input type="radio" name="q1" value="d"> D. Bjarne Stroustrup</label>

<h3>2. Why do we learn Python?</h3>
<label><input type="radio" name="q2" value="a"> A. Web Development</label>
<label><input type="radio" name="q2" value="b"> B. AI & Machine Learning</label>
<label><input type="radio" name="q2" value="c"> C. Automation</label>
<label><input type="radio" name="q2" value="d"> D. All of the Above</label>

<h3>3. Which is the correct Python output statement?</h3>
<label><input type="radio" name="q3" value="a"> A. Print("")</label>
<label><input type="radio" name="q3" value="b"> B. print()</label>
<label><input type="radio" name="q3" value="c"> C. println()</label>

<br>

<button type="button" onclick="checkQuiz()">Submit</button>

<h2 id="result"></h2>

</form>

</div>

<script>
function checkQuiz(){

let score=0;

if(document.querySelector('input[name="q1"]:checked')?.value=="b"){
score++;
}

if(document.querySelector('input[name="q2"]:checked')?.value=="d"){
score++;
}

if(document.querySelector('input[name="q3"]:checked')?.value=="a"){
score++;
}

document.getElementById("result").innerHTML="Your Score : "+score+" / 3";

}
</script>

</body>
</html>
